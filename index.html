<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#070818">
  <meta name="description" content="Brick Smasher: a neon arcade brick-breaking game with power-ups and 10 levels.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>Brick Smasher</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="src/style.css">
</head>
<body>
  <canvas id="game" aria-label="Brick Smasher game"></canvas>

  <div id="panel" class="lb" hidden>
    <div class="lb-card" role="dialog" aria-labelledby="lb-title">
      <button class="lb-close" aria-label="Close">&times;</button>
      <h2 id="lb-title">LEADERBOARD</h2>
      <form id="lb-form" hidden>
        <p id="lb-form-msg"></p>
        <div class="lb-row">
          <input id="lb-name" maxlength="12" placeholder="Your nickname" autocomplete="nickname" enterkeyhint="send">
          <button type="submit">SUBMIT</button>
        </div>
        <p id="lb-form-err" class="lb-err"></p>
      </form>
      <div class="lb-tabs" role="tablist">
        <button data-diff="easy" role="tab">EASY</button>
        <button data-diff="normal" role="tab">NORMAL</button>
        <button data-diff="hard" role="tab">HARD</button>
      </div>
      <p id="lb-status"></p>
      <ol id="lb-list"></ol>
    </div>
  </div>
  <script src="src/levels.js"></script>
  <script src="src/audio.js"></script>
  <script src="src/leaderboard.js"></script>
  <script src="src/main.js"></script>
</body>
</html>
